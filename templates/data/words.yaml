# Commit messages are built from parts; each team has its own convention
# (conventional commits, ticket prefixes, capitalisation).
commit_verbs: [fix, add, update, remove, refactor, bump, rename, move, handle, cache, validate, log, clean up, revert, tweak, migrate, extract, simplify, guard, retry]
commit_objects: [auth middleware, checkout flow, invoice export, password reset, api pagination, cron schedule, mail templates, upload limits, search index, session timeout, rate limiting, admin dashboard, webhook handler, db indexes, cache keys, csv import, error pages, healthcheck, ci pipeline, docker image, dependencies, translations, timezone handling, report query, user roles, sitemap, seo meta tags]
commit_tails: ["", "", "", "", "for {resource}", "in {resource} api", on staging, after deploy, for mobile, (again), edge case, null check, typo, per review, for large accounts]
commit_types: [feat, fix, chore, refactor, perf, docs, test, ci, build]

# Generic words mixed into page text and slugs.
filler: [our, team, customers, new, process, update, service, quality, support, reliable,
  simple, faster, improved, partners, launch, region, available, options, details, guide,
  how, to, the, with, for, and, in, your, we, more, today, plan, change, review, notes,
  policy, pricing, local, global, data]

# Industries shape company names, tables, API resources and site wording.
industries:
  - id: logistics
    suffixes: [Logistics, Freight, Cargo, Shipping, Transport]
    resources: [shipments, carriers, warehouses, routes, drivers, invoices]
    vocabulary: [tracking, fleet, depot, manifest, customs, pallets, dispatch, tariffs, lanes, pickup, delivery, freight-rates, terminals, hubs]
    sells_online: false
  - id: retail
    suffixes: [Store, Market, Goods, Outfitters, Supply, Shop]
    resources: [orders, products, customers, carts, coupons, returns]
    vocabulary: [catalog, collections, sale, new-arrivals, gift-cards, brands, size-guide, shipping, lookbook, clearance, accessories, outlet]
    sells_online: true
  - id: health
    suffixes: [Health, Clinic, Care, Medical, Wellness]
    resources: [patients, appointments, practitioners, prescriptions, claims]
    vocabulary: [services, locations, doctors, insurance, telehealth, pharmacy, lab-results, billing, careers, patient-portal, forms, faq]
    sells_online: false
  - id: saas
    suffixes: [Labs, Cloud, Systems, Software, IO, HQ]
    resources: [accounts, workspaces, subscriptions, invoices, api_keys, events]
    vocabulary: [docs, changelog, integrations, pricing, status, guides, sdk, webhooks, security, roadmap, templates, release-notes, api-reference]
    sells_online: true
  - id: media
    suffixes: [Media, Press, News, Studio, Publishing]
    resources: [articles, authors, subscribers, comments, issues]
    vocabulary: [politics, business, culture, opinion, sports, science, archive, podcasts, newsletters, events, photo, video, editorials]
