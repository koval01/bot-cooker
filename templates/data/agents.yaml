# User-Agent generation. Nothing here is a finished UA string: versions are
# computed from the date being simulated (release cadences below), each
# instance re-weights the mix, and visitors lag behind the latest release by
# a realistic amount. Placeholders are filled from the computed versions.

# Linear cadences: major = base + floor((date - since) / days).
cadences:
  # Real cadences slip around holidays: averaged over the last releases.
  chrome: {base: 130, since: "2024-10-15", days: 31}
  firefox: {base: 132, since: "2024-10-29", days: 29}
  samsung: {base: 23, since: "2023-11-01", days: 100}

# Stepped releases: the value valid from each date on.
steps:
  safari:
    - ["2023-09-18", "17"]
    - ["2024-09-16", "18"]
    - ["2025-09-15", "26"]
  ios:
    - ["2023-09-18", "17_0"]
    - ["2024-03-05", "17_4"]
    - ["2024-09-16", "18_0"]
    - ["2025-03-31", "18_4"]
    - ["2025-09-15", "26_0"]
    - ["2026-03-30", "26_4"]
  curl:
    - ["2023-12-06", "8.5.0"]
    - ["2024-03-27", "8.7.1"]
    - ["2024-07-24", "8.9.0"]
    - ["2024-11-06", "8.11.0"]
    - ["2025-04-02", "8.13.0"]
    - ["2025-09-10", "8.16.0"]
    - ["2026-03-04", "8.19.0"]
  requests:
    - ["2023-05-22", "2.31.0"]
    - ["2024-05-20", "2.32.2"]
    - ["2024-05-29", "2.32.3"]
    - ["2025-06-09", "2.32.4"]
    - ["2025-08-18", "2.32.5"]
  wget:
    - ["2023-05-20", "1.21.4"]
    - ["2024-08-31", "1.24.5"]
    - ["2025-07-01", "1.25.0"]

# How far behind the newest release visitors run (in major versions).
lag: {0: 45, 1: 30, 2: 12, 3: 6, 5: 4, 9: 3}

browsers:
