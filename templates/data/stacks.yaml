# Facts about each application stack a persona can run. The persona picks
# from these lists with its own seed; templates under stacks/<id>/ render the
# stack's files. Placeholders: {short} = short company slug, {rand4}/{rand5}
# = random lowercase token of that length.
#
# Weighted maps (`frontends`, `databases`, `envelopes`, ...) are relative
# weights; plain lists are uniform picks.
#
# HTTP behaviour of the application (values are inline templates rendered
# with the request context; `rand.*` is per-request randomness, `now` the
# wall clock, `body_len` the response size):
#   app_headers      headers on every application response
#   session_headers  extra headers when a session is started
#   cookies          Set-Cookie values when a session is started
#   options          OPTIONS on an app route: an Allow list, `405`, `404`
#                    or `page` (answer like GET)
#   post             POST to a page that doesn't take one: `405`, `404`,
#                    `419`, `403` or `page`
#   error_type       Content-Type of the framework's error pages

laravel:
  name: Laravel
  family: php
  weight: 14
  frontends: {nginx: 45, apache: 35, litespeed: 3, openresty: 5, caddy: 5}
  databases: {mysql: 5, mariadb: 2, postgres: 3}
  versions: ["9.52.16|9.52.22", "10.48.4|10.50.3", "11.21.0|11.57.0", "12.70.1", "13.38.0"]
  naming: {snake: 9, camel: 1}
  dotenv: 1.0
  app_logs: {p: 1.0, paths: [/storage/logs/laravel.log]}
  login_paths: [/login, /admin/login, /auth/login, /admin]
  api_prefixes: [/api, /api/v1, /api/v2, /v1, /rest/v1, /api/v3]
  envelopes: {data_links_meta: 7, items: 2, bare_array: 1}
  session_cookies: {laravel_session: 6, "{short}_session": 4}
  csrf_cookie: XSRF-TOKEN
  powered_by: {p: 0.45, value: "PHP/{runtime}"}
  app_headers: [[cache-control, "no-cache, private"]]
  cookies:
    - "{{ web.csrf_cookie }}=eyJpdiI6I{{ rand.alnum(300) }}%3D%3D; expires={{ (now + 7200)|strftime('%a, %d %b %Y %H:%M:%S GMT') }}; Max-Age=7200; path=/; samesite=lax"
    - "{{ web.session_cookie }}=eyJpdiI6I{{ rand.alnum(300) }}%3D%3D; expires={{ (now + 7200)|strftime('%a, %d %b %Y %H:%M:%S GMT') }}; Max-Age=7200; path=/; httponly; samesite=lax"
  options: GET, HEAD
  post: "419"
  error_type: text/html; charset=UTF-8
  hash: bcrypt_2y
  routes:
    - {pattern: /_ignition/health-check, profile: json}
    - {pattern: /up, profile: blank}

