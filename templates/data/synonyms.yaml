# Interchangeable words. Every persona settles on its own choice per group
# (its "voice"), and now and then varies it, so the same sentence shape
# reads differently from one instance to the next.
groups:
  - [team, staff, crew, people]
  - [customers, clients, users]
  - [customer, client, user]
  - [faster, quicker, speedier]
  - [fix, repair, resolve]
  - [fixed, resolved, sorted out]
  - [issues, problems, bugs]
  - [easy, simple, straightforward]
  - [help, support, assist]
  - [start, begin, kick off]
  - [started, began]
  - [big, large, major]
  - [small, minor, little]
  - [new, fresh, updated]
  - [show, display]
  - [shows, displays]
  - [change, update, adjustment]
  - [changes, updates, adjustments]
  - [plan, intend, aim]
  - [important, essential, key]
  - [quickly, fast, promptly]
  - [often, frequently, regularly]
  - [around, about, roughly]
  - [answer, reply, response]
  - [answers, replies, responses]
  - [hard, difficult, tough]
  - [honest, frank, candid]
  - [finished, done, complete]
  - [tools, systems, utilities]
  - [rebuilt, reworked, redesigned]
  - [noticed, spotted, saw]
  - [message, note]
  - [email, e-mail, mail]
  - [settings, preferences, options]
  - [page, screen, view]
  - [file, document]
  - [week, seven days]
  - [busy, hectic, packed]
  - [proud, pleased, happy]
  - [tired, exhausted, worn out]

# Discourse markers: each persona settles on a few it likes and sometimes
# opens a sentence with one.
markers: [Honestly, In short, As before, For now, In practice, To be clear, Meanwhile, As always, Put simply, In the end, Still, Of course, Right now, So far, By now, Overall, In any case, Frankly, Above all, At the moment]
